<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>特性示例：漸變色陰影點擊縮放</title>
  <script src="/include/jquery@3.3.1/jquery.min.js"></script>
  <script src="/include/require@2.3.6/require.js"></script>
</head>

<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  #ex11 {
    width: 100%;
    height: 100%;
  }
</style>

<body>
  <div id="ex11"></div>
  <script type="text/javascript">
    require.config({
      paths: {
        echarts: "/include/echarts/echarts.min",
      },
    });
    require(["echarts"], function (echarts) {

      function setSize(chartDom, baseSize) {
        const chartWidth = chartDom.clientWidth;
        let scaleFactor = chartWidth / 1920;
        return baseSize * scaleFactor;
      }

      function getChartOptions(chartDom, data0, data1, colors) {
        return {
          grid: {
            x: setSize(chartDom, 40),
            x2: setSize(chartDom, 10),
            y: setSize(chartDom, 30),
            y2: setSize(chartDom, 20),
            borderWidth: 1,
          },
          xAxis: {
            data: data0,
            axisLabel: {
              inside: true,
              color: "#fff",
            },
            axisTick: {
              show: false,
            },
            axisLine: {
              show: false,
            },
            z: 10,
          },
          yAxis: {
            axisLine: {
              show: false,
            },
            axisTick: {
              show: false,
            },
            axisLabel: {
              lineStyle: {
                color: 'rgba(255, 255, 255, 0.5)' // Y軸線條
              }
            },
          },
          dataZoom: [
            {
              type: "inside",
            },
          ],
          series: [
            {
              type: "bar",
              showBackground: true,
              itemStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, colors.pieGradientSub || [
                  { offset: 0, color: "#83bff6" },
                  { offset: 0.5, color: "#188df0" },
                  { offset: 1, color: "#188df0" },
                ]),
              },
              emphasis: {
                itemStyle: {
                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, colors.pieGradient || [
                    { offset: 0, color: "#2378f7" },
                    { offset: 0.7, color: "#2378f7" },
                    { offset: 1, color: "#83bff6" },
                  ]),
                },
              },
              data: data1,
            },
          ]
        }
      }



      var chartDom = document.getElementById("ex11");
      var myChart = echarts.init(chartDom);


      var initialData0 = ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""];
      var initialData1 = ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""];
      var currentData0 = [...initialData0];
      var currentData1 = [...initialData1];
      let yMax = 500;
      let dataShadow = [];
      for (let i = 0; i < initialData1.length; i++) {
        dataShadow.push(yMax);
      }
      var currentColors = {
        pieGradient: [
          { offset: 0, color: "#2378f7" },
          { offset: 0.7, color: "#2378f7" },
          { offset: 1, color: "#83bff6" },
        ],
        pieGradientSub: [
          { offset: 0, color: "#83bff6" },
          { offset: 0.5, color: "#188df0" },
          { offset: 1, color: "#188df0" },
        ],
      };

      var option = getChartOptions(chartDom, currentData0, currentData1, currentColors);
      myChart.setOption(option);

      function resizeChart() {
        myChart.setOption(option);
        myChart.resize();
      }

      window.addEventListener('resize', resizeChart);


      // 🚀control data
      var data0 = option.xAxis.data;
      var data1 = option.series[0].data;

      function getTime() {
        var now = new Date();
        return now.toLocaleTimeString().replace(/^\D*/, "");
      }

      setInterval(function () {
        data0.shift();
        data0.push(getTime());
        data1.shift();
        data1.push((Math.random() * (80 - 60 + 1) + 60).toFixed(2));
        // 只更新數據
        myChart.setOption({
          xAxis: {
            data: currentData0
          },
          series: [
            {
              data: currentData1
            }
          ]
        });
      }, 1000);

      window.addEventListener('message', function (event) {
        if (event.data.type === 'changeColor') {
          currentColors.lineColor = event.data.colors.barColor;
          currentColors.pieGradient = event.data.colors.pieGradient;
          currentColors.pieGradientSub = event.data.colors.pieGradientSub;
          currentColors.axisLabelColor = event.data.colors.axisLabelColor;
          var option = getChartOptions(chartDom, currentData0, currentData1, currentColors);
          myChart.setOption(option);
        }
      });

    });
    const zoomSize = 6;
  </script>
</body>

</html>
