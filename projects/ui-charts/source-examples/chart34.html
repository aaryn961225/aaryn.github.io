<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>使用自定係列給柱狀圖</title>
  <script src="/include/jquery@3.3.1/jquery.min.js"></script>
  <script src="/include/require@2.3.6/require.js"></script>
</head>

<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  #ex34 {
    width: 100%;
    height: 100%;
  }
</style>

<body>
  <div id="ex34"></div>
  <script type="text/javascript">
    require.config({
      paths: {
        echarts: "/include/echarts/echarts.min",
      },
    });
    require(["echarts"], function (echarts) {
      var myChart = echarts.init(document.getElementById("ex34"));
      var categoryData = [];
      var errorData = [];
      var barData = [];
      var dataCount = 100;
      for (var i = 0; i < dataCount; i++) {
        var val = Math.random() * 1000;
        categoryData.push("category" + i);
        errorData.push([
          i,
          echarts.number.round(Math.max(0, val - Math.random() * 100)),
          echarts.number.round(val + Math.random() * 80),
        ]);
        barData.push(echarts.number.round(val, 2));
      }

      var currentColors = {
        barColor: "#77bef7",
        errorColor: "#FF0000",
      };

      function setSize(params, baseSize) {
        const chartWidth = params.clientWidth;
        let scaleFactor = chartWidth / 1920;
        return baseSize * scaleFactor;
      }

      function getChartOptions(categoryData, barData, errorData, colors) {
        return {
          tooltip: {
            trigger: "axis",
            axisPointer: {
              type: "shadow",
            },
          },
          title: {
            text: "Error bar chart",
          },
          legend: {
            data: ["bar", "error"],
          },
          dataZoom: [
            {
              type: "slider",
              start: 50,
              end: 70,
            },
            {
              type: "inside",
              start: 50,
              end: 70,
            },
          ],
          xAxis: {
            data: categoryData,
          },
          yAxis: {},
          series: [
            {
              type: "bar",
              name: "bar",
              data: barData,
              itemStyle: {
                color: colors.barColor,
              },
            },
            {
              type: "custom",
              name: "error",
              itemStyle: {
                borderWidth: 1.5,
              },
              renderItem: function (params, api) {
                var xValue = api.value(0);
                var highPoint = api.coord([xValue, api.value(1)]);
                var lowPoint = api.coord([xValue, api.value(2)]);
                var halfWidth = api.size([1, 0])[0] * 0.1;
                var style = api.style({
                  stroke: colors.errorColor,
                  fill: undefined,
                });
                return {
                  grid: {
                    x: setSize(params, 40),
                    x2: setSize(params, 10),
                    y: setSize(params, 30),
                    y2: setSize(params, 20),
                    borderWidth: 1,
                  },
                  type: "group",
                  children: [
                    {
                      type: "line",
                      transition: ["shape"],
                      shape: {
                        x1: highPoint[0] - halfWidth,
                        y1: highPoint[1],
                        x2: highPoint[0] + halfWidth,
                        y2: highPoint[1],
                      },
                      style: style,
                    },
                    {
                      type: "line",
                      transition: ["shape"],
                      shape: {
                        x1: highPoint[0],
                        y1: highPoint[1],
                        x2: lowPoint[0],
                        y2: lowPoint[1],
                      },
                      style: style,
                    },
                    {
                      type: "line",
                      transition: ["shape"],
                      shape: {
                        x1: lowPoint[0] - halfWidth,
                        y1: lowPoint[1],
                        x2: lowPoint[0] + halfWidth,
                        y2: lowPoint[1],
                      },
                      style: style,
                    },
                  ],
                };
              },
              encode: {
                x: 0,
                y: [1, 2],
              },
              data: errorData,
              z: 100,
            },
          ],
        };
      }

      var option = getChartOptions(categoryData, barData, errorData, currentColors);
      myChart.setOption(option);

      window.addEventListener('resize', function () {
        myChart.resize();
      });

      window.addEventListener('message', function (event) {
        if (event.data.type === 'changeColor') {
          currentColors.barColor = event.data.colors.barColor;
          currentColors.errorColor = event.data.colors.errorColor;
          var option = getChartOptions(categoryData, barData, errorData, currentColors);
          myChart.setOption(option);
        }
      });
    });
  </script>
</body>

</html>
