<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>北京AQI</title>
    <script src="/include/jquery@3.3.1/jquery.min.js"></script>
    <script src="/include/require@2.3.6/require.js"></script>
  </head>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #ex06 {
      width: 100%;
      height: 100%;
    }
  </style>

  <body>
    <div id="ex06"></div>
    <script type="text/javascript">
      require.config({
        paths: {
          echarts: "/include/echarts/echarts.min",
        },
      });
      require(["echarts"], function (echarts) {
        var myChart = echarts.init(document.getElementById("ex06"));
        $.get(ROOT_PATH + "/data/asset/data/aqi-beijing.json", function (data) {
          myChart.setOption(
            (option = {
              title: {
                text: "Beijing AQI",
                left: "1%",
              },
              tooltip: {
                trigger: "axis",
              },
              grid: {
                left: "5%",
                right: "15%",
                bottom: "10%",
              },
              xAxis: {
                data: data.map(function (item) {
                  return item[0];
                }),
              },
              yAxis: {},
              toolbox: {
                right: 10,
                feature: {
                  dataZoom: {
                    yAxisIndex: "none",
                  },
                  restore: {},
                  saveAsImage: {},
                },
              },
              dataZoom: [
                {
                  startValue: "2014-06-01",
                },
                {
                  type: "inside",
                },
              ],
              visualMap: {
                top: 50,
                right: 10,
                pieces: [
                  {
                    gt: 0,
                    lte: 50,
                    color: "#93CE07",
                  },
                  {
                    gt: 50,
                    lte: 100,
                    color: "#FBDB0F",
                  },
                  {
                    gt: 100,
                    lte: 150,
                    color: "#FC7D02",
                  },
                  {
                    gt: 150,
                    lte: 200,
                    color: "#FD0100",
                  },
                  {
                    gt: 200,
                    lte: 300,
                    color: "#AA069F",
                  },
                  {
                    gt: 300,
                    color: "#AC3B2A",
                  },
                ],
                outOfRange: {
                  color: "#999",
                },
              },
              series: {
                name: "Beijing AQI",
                type: "line",
                data: data.map(function (item) {
                  return item[1];
                }),
                markLine: {
                  silent: true,
                  lineStyle: {
                    color: "#333",
                  },
                  data: [
                    {
                      yAxis: 50,
                    },
                    {
                      yAxis: 100,
                    },
                    {
                      yAxis: 150,
                    },
                    {
                      yAxis: 200,
                    },
                    {
                      yAxis: 300,
                    },
                  ],
                },
              },
            })
          );
        });

        myChart.setOption(option);
      });
    </script>
  </body>
</html>
