<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%">

<head>
  <meta charset="utf-8" />
  <title>自定義儀表</title>
  <script src="/include/echarts/echarts.min2.js"></script>
</head>

<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  <script type="text/javascript">

    var dom = document.getElementById("container");
    var myChart = echarts.init(dom, null, {
      // renderer: "canvas",
      // useDirtyRect: false,
    });
    var app = {};
    var ROOT_PATH = "https://echarts.apache.org/examples";
    var option;

    var _panelImageURL = ROOT_PATH + "/data/asset/img/custom-gauge-panel.png";
    var _animationDuration = 1000;
    var _animationDurationUpdate = 1000;
    var _animationEasingUpdate = "quarticInOut";
    var _valOnRadianMax = 200;
    var _outerRadius = 200;
    var _innerRadius = 170;
    var _pointerInnerRadius = 40;
    var _insidePanelRadius = 140;
    var _currentDataIndex = 0;

    var currentColors = {
      barColor: '#FF5733',
      pieGradient: [
        { offset: 0, color: '#FF5733' },
        { offset: 1, color: '#FFC300' }
      ],
      pieGradientSub: [
        { offset: 0, color: '#ff9680' },
        { offset: 1, color: '#ffd680' }
      ],
      axisLabelColor: '#FF5733',
      axisLineColor: '#FFC300',
      seriesColors: ['#FEFFD2', '#FFEEA9', '#FDDE55', '#FFBF78', '#FF7D29'],
      fillColor: "#fff",
      shadowColor: "rgba(76,107,167,0.4)",
      textColor: "rgb(0,50,190)"
    };

    function setSize(params, baseSize) {
        const chartWidth = params.clientWidth;
        let scaleFactor = chartWidth / 1920;
        return baseSize * scaleFactor;
      }

    function renderItem(params, api) {
      var valOnRadian = api.value(1);
      var coords = api.coord([api.value(0), valOnRadian]);
      var polarEndRadian = coords[3];
      var imageStyle = {
        image: _panelImageURL,
        x: params.coordSys.cx - _outerRadius,
        y: params.coordSys.cy - _outerRadius,
        width: _outerRadius * 2,
        height: _outerRadius * 2,
      };
      return {
        grid: {
          x: setSize(params, 40),
          x2: setSize(params, 10),
          y: setSize(params, 30),
          y2: setSize(params, 20),
          borderWidth: 1,
        },
        type: "group",
        children: [
          {
            type: "image",
            style: imageStyle,
            clipPath: {
              type: "sector",
              shape: {
                cx: params.coordSys.cx,
                cy: params.coordSys.cy,
                r: _outerRadius,
                r0: _innerRadius,
                startAngle: 0,
                endAngle: -polarEndRadian,
                transition: "endAngle",
                enterFrom: { endAngle: 0 },
              },
            },
          },
          {
            type: "image",
            style: imageStyle,
            clipPath: {
              type: "polygon",
              shape: {
                points: makePionterPoints(params, polarEndRadian),
              },
              extra: {
                polarEndRadian: polarEndRadian,
                transition: "polarEndRadian",
                enterFrom: { polarEndRadian: 0 },
              },
              during: function (apiDuring) {
                apiDuring.setShape(
                  "points",
                  makePionterPoints(
                    params,
                    apiDuring.getExtra("polarEndRadian")
                  )
                );
              },
            },
          },
          {
            type: "circle",
            shape: {
              cx: params.coordSys.cx,
              cy: params.coordSys.cy,
              r: _insidePanelRadius,
            },
            style: {
              fill: currentColors.fillColor,
              shadowBlur: 25,
              shadowOffsetX: 0,
              shadowOffsetY: 0,
              shadowColor: currentColors.shadowColor,
            },
          },
          {
            type: "text",
            extra: {
              valOnRadian: valOnRadian,
              transition: "valOnRadian",
              enterFrom: { valOnRadian: 0 },
            },
            style: {
              text: makeText(valOnRadian),
              fontSize: 50,
              fontWeight: 700,
              x: params.coordSys.cx,
              y: params.coordSys.cy,
              fill: currentColors.textColor,
              align: "center",
              verticalAlign: "middle",
              enterFrom: { opacity: 0 },
            },
            during: function (apiDuring) {
              apiDuring.setStyle(
                "text",
                makeText(apiDuring.getExtra("valOnRadian"))
              );
            },
          },
        ],
      };
    }

    function convertToPolarPoint(renderItemParams, radius, radian) {
      return [
        Math.cos(radian) * radius + renderItemParams.coordSys.cx,
        -Math.sin(radian) * radius + renderItemParams.coordSys.cy,
      ];
    }

    function makePionterPoints(renderItemParams, polarEndRadian) {
      return [
        convertToPolarPoint(renderItemParams, _outerRadius, polarEndRadian),
        convertToPolarPoint(
          renderItemParams,
          _outerRadius,
          polarEndRadian + Math.PI * 0.03
        ),
        convertToPolarPoint(
          renderItemParams,
          _pointerInnerRadius,
          polarEndRadian
        ),
      ];
    }

    function makeText(valOnRadian) {
      return ((valOnRadian / _valOnRadianMax) * 100).toFixed(0) + "%";
    }

    function getChartOptions() {
      return {
        animationEasing: _animationEasingUpdate,
        animationDuration: _animationDuration,
        animationDurationUpdate: _animationDurationUpdate,
        animationEasingUpdate: _animationEasingUpdate,
        dataset: {
          source: [[1, 156]],
        },
        tooltip: {},
        angleAxis: {
          type: "value",
          startAngle: 0,
          show: false,
          min: 0,
          max: _valOnRadianMax,
        },
        radiusAxis: {
          type: "value",
          show: false,
        },
        polar: {},
        series: [
          {
            type: "custom",
            coordinateSystem: "polar",
            renderItem: renderItem,
          },
        ],
      };
    }

    option = getChartOptions();

    setInterval(function () {
      var nextSource = [[1, Math.round(Math.random() * _valOnRadianMax)]];
      myChart.setOption({
        dataset: {
          source: nextSource,
        },
      });
    }, 2000);

    if (option && typeof option === "object") {
      myChart.setOption(option);
    }

    window.addEventListener("resize", myChart.resize);

    window.addEventListener('message', function (event) {
      if (event.data.type === 'changeColor') {
        currentColors.barColor = event.data.colors.barColor;
        currentColors.pieGradient = event.data.colors.pieGradient;
        currentColors.pieGradientSub = event.data.colors.pieGradientSub;
        currentColors.axisLabelColor = event.data.colors.axisLabelColor;
        currentColors.axisLineColor = event.data.colors.axisLineColor;
        currentColors.seriesColors = event.data.colors.seriesColors;
        option = getChartOptions();  // Create a new option with updated colors
        myChart.setOption(option);
      }
    });
  </script>
</body>

</html>
