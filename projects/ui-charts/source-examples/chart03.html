<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>堆疊面積圖</title>
  <script src="/include/jquery@3.3.1/jquery.min.js"></script>
  <script src="/include/require@2.3.6/require.js"></script>
</head>

<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: transparent;
  }

  #ex03 {
    width: 100%;
    height: 100%;
  }
</style>

<body>
  <div id="ex03"></div>
  <script type="text/javascript">
    require.config({
      paths: {
        echarts: "/include/echarts/echarts.min",
      },
    });

    require(["echarts"], function (echarts) {

      function setSize(chartDom, baseSize) {
        const chartWidth = chartDom.clientWidth;
        let scaleFactor = chartWidth / 1920;
        return baseSize * scaleFactor;
      }

      function getChartOptions(chartDom, data0, data1, data2, data3, data4, data5, colors) {
        return {
          grid: {
            x: setSize(chartDom, 40),
            x2: setSize(chartDom, 10),
            y: setSize(chartDom, 50),
            y2: setSize(chartDom, 20),
            borderWidth: 1,
          },
          tooltip: {
            trigger: "axis",
            axisPointer: {
              type: "cross",
              label: {
                backgroundColor: "#6a7985" // Tooltip指示器
              },
            },
          },
          legend: {
            data: ["a", "b", "c", "d", "e"],
            textStyle: {
              color: colors.legendTextColor || '#000000' // 圖例文字
            }
          },
          xAxis: [
            {
              type: "category",
              boundaryGap: false,
              data: data0,
              axisLine: {
                lineStyle: {
                  color:'rgba(255, 255, 255, 0.5)' // x軸線條
                }
              },
              axisLabel: {
                color: colors.axisLabelColor || '#000000' // X軸標籤
              }
            },
          ],
          yAxis: [
            {
              type: "value",
              axisLine: {
                lineStyle: {
                  color:'rgba(255, 255, 255, 0.5)' // Y軸線條
                }
              },
              axisLabel: {
                color: colors.axisLabelColor || '#000000' // Y軸標籤
              }
            },
          ],
          series: [
            {
              name: "a",
              type: "line",
              stack: "Total",
              areaStyle: {},
              emphasis: {
                focus: "series",
              },
              data: data1,
              itemStyle: {
                color: colors.seriesColors ? colors.seriesColors[0] : '#FFCC70' 
              }
            },
            {
              name: "b",
              type: "line",
              stack: "Total",
              areaStyle: {},
              emphasis: {
                focus: "series",
              },
              data: data2,
              itemStyle: {
                color: colors.seriesColors ? colors.seriesColors[1] : '#FFFADD' 
              }
            },
            {
              name: "c",
              type: "line",
              stack: "Total",
              areaStyle: {},
              emphasis: {
                focus: "series",
              },
              data: data3,
              itemStyle: {
                color: colors.seriesColors ? colors.seriesColors[2] : '#8ECDDD' 
              }
            },
            {
              name: "d",
              type: "line",
              stack: "Total",
              areaStyle: {},
              emphasis: {
                focus: "series",
              },
              data: data4,
              itemStyle: {
                color: colors.seriesColors ? colors.seriesColors[3] : '#A2C579' 
              }
            },
            {
              name: "e",
              type: "line",
              stack: "Total",
              label: {
                show: true,
                position: "top",
              },
              areaStyle: {},
              emphasis: {
                focus: "series",
              },
              data: data5,
              itemStyle: {
                color: colors.seriesColors ? colors.seriesColors[4] : '#22668D' 
              }
            }
          ],
        };
      }

      var chartDom = document.getElementById("ex03");
      var myChart = echarts.init(chartDom);

      var initialData0 = ["", "", "", "", ""];
      var initialData1 = ["", "", "", "", ""];
      var initialData2 = ["", "", "", "", ""];
      var initialData3 = ["", "", "", "", ""];
      var initialData4 = ["", "", "", "", ""];
      var initialData5 = ["", "", "", "", ""];
      var currentData0 = [...initialData0];
      var currentData1 = [...initialData1];
      var currentData2 = [...initialData2];
      var currentData3 = [...initialData3];
      var currentData4 = [...initialData4];
      var currentData5 = [...initialData5];

      var currentColors = {
        axisLineColor: '#9e9e9e',
        axisLabelColor: '#757575',
        seriesColors: ['#FFCC70', '#FFFADD', '#8ECDDD', '#A2C579', '#22668D'],
      };

      var option = getChartOptions(chartDom, currentData0, currentData1, currentData2, currentData3, currentData4, currentData5, currentColors);
      myChart.setOption(option);

      function resizeChart() {
        myChart.setOption(option);
        myChart.resize();
      }

      window.addEventListener('resize', resizeChart);

      // 🚀control data
      var data1 = option.series[0].data;
      var data2 = option.series[1].data;
      var data3 = option.series[2].data;
      var data4 = option.series[3].data;
      var data5 = option.series[4].data;

      function getTime() {
        var now = new Date();
        return now.toLocaleTimeString().replace(/^\D*/, "");
      }

      setInterval(function () {
        // 数据更新
        data1.shift();
        data1.push((Math.random()).toFixed(1));
        data2.shift();
        data2.push((Math.random()).toFixed(1));
        data3.shift();
        data3.push((Math.random()).toFixed(1));
        data4.shift();
        data4.push((Math.random()).toFixed(1));
        data5.shift();
        data5.push((Math.random()).toFixed(1));

        myChart.setOption({
          xAxis: {
            data: currentData0
          },
          series: [
            { data: currentData1 },
            { data: currentData2 },
            { data: currentData3 },
            { data: currentData4 },
            { data: currentData5 }
          ]
        });
      }, 1000);

      window.addEventListener('message', function (event) {
        if (event.data.type === 'changeColor') {
          currentColors = {
            ...currentColors,
            axisLineColor: event.data.colors.axisLineColor,
            axisLabelColor: event.data.colors.axisLabelColor,
            seriesColors: event.data.colors.seriesColors,
          };
          var option = getChartOptions(chartDom, currentData0, currentData1, currentData2, currentData3, currentData4, currentData5, currentColors);
          myChart.setOption(option);
        }
      });
    });
  </script>

</body>

</html>
