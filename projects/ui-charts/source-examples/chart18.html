<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%">
  <head>
    <meta charset="utf-8" />
    <title>Bar Chart on Polar</title>
    <script src="/include/echarts/echarts.min2.js"></script>
  </head>
  <body style="height: 100%; margin: 0">
    <div id="container" style="height: 100%"></div>

    <script type="text/javascript">
      var dom = document.getElementById("container");
      var myChart = echarts.init(dom, null, document.getElementById("ex18"), {
        renderer: "canvas",
        useDirtyRect: false,
      });
      var app = {};

      var option;

      const data = [
        [5000, 10000, 6785.71],
        [4000, 10000, 6825],
        [3000, 6500, 4463.33],
        [2500, 5600, 3793.83],
        [2000, 4000, 3060],
        [2000, 4000, 3222.33],
        [2500, 4000, 3133.33],
        [1800, 4000, 3100],
        [2000, 3500, 2750],
        [2000, 3000, 2500],
        [1800, 3000, 2433.33],
        [2000, 2700, 2375],
        [1500, 2800, 2150],
        [1500, 2300, 2100],
        [1600, 3500, 2057.14],
        [1500, 2600, 2037.5],
        [1500, 2417.54, 1905.85],
        [1500, 2000, 1775],
        [1500, 1800, 1650],
      ];
      // prettier-ignore
      const cities = ["","","","","","","","","","","","","","","","","",""];
      const barHeight = 50;

      var currentColors = {
        barColor: '#FF5733',
        pieGradient: [
          { offset: 0, color: '#FF5733' },
          { offset: 1, color: '#FFC300' }
        ],
        pieGradientSub: [
          { offset: 0, color: '#ff9680' },
          { offset: 1, color: '#ffd680' }
        ],
        axisLabelColor: '#FF5733',
        axisLineColor: '#FFC300',
        seriesColors: ['#FEFFD2', '#FFEEA9', '#FDDE55', '#FFBF78', '#FF7D29']
      };

      function setSize(chartDom, baseSize) {
        const chartWidth = chartDom.clientWidth;
        let scaleFactor = chartWidth / 1920;
        return baseSize * scaleFactor;
      }

      function getChartOptions(colors) {
        return {
          title: {
            text: "",
            subtext: "",
          },
          legend: {
            show: true,
            top: "bottom",
            data: ["a", "b"],
          },          
          grid: {
            x: setSize(chartDom, 40),
            x2: setSize(chartDom, 10),
            y: setSize(chartDom, 30),
            y2: setSize(chartDom, 20),
            borderWidth: 1,
          },
          angleAxis: {
            type: "category",
            data: cities,
            axisLine: {
              lineStyle: {
                color: colors.axisLineColor,
              },
            },
            axisLabel: {
              textStyle: {
                color: colors.axisLabelColor,
              },
            },
          },
          tooltip: {
            show: true,
            formatter: function (params) {
              const id = params.dataIndex;
              return (
                cities[id] +
                "<br>Lowest：" +
                data[id][0] +
                "<br>Highest：" +
                data[id][1] +
                "<br>Average：" +
                data[id][2]
              );
            },
          },
          radiusAxis: {},
          polar: {},
          series: [
            {
              type: "bar",
              itemStyle: {
                color: "transparent",
              },
              data: data.map(function (d) {
                return d[0];
              }),
              coordinateSystem: "polar",
              stack: "Min Max",
              silent: true,
            },
            {
              type: "bar",
              data: data.map(function (d) {
                return d[1] - d[0];
              }),
              coordinateSystem: "polar",
              name: "Range",
              stack: "Min Max",
              itemStyle: {
                color: colors.barColor,
              },
            },
            {
              type: "bar",
              itemStyle: {
                color: "transparent",
              },
              data: data.map(function (d) {
                return d[2] - barHeight;
              }),
              coordinateSystem: "polar",
              stack: "Average",
              silent: true,
              z: 10,
            },
            {
              type: "bar",
              data: data.map(function (d) {
                return barHeight * 2;
              }),
              coordinateSystem: "polar",
              name: "Average",
              stack: "Average",
              barGap: "-100%",
              z: 10,
              itemStyle: {
                color: {
                  type: 'linear',
                  x: 0,
                  y: 0,
                  x2: 1,
                  y2: 1,
                  colorStops: colors.pieGradient,
                  global: false
                }
              }
            },
          ],
        };
      }

      option = getChartOptions(currentColors);

      if (option && typeof option === "object") {
        myChart.setOption(option);
      }

      window.addEventListener("resize", myChart.resize);

      // control data
      var data1 = option.series[0].data;
      var data2 = option.series[1].data;
      var data3 = option.series[2].data;
      var data4 = option.series[3].data;

      function randomData() {
        var now = new Date();
        return now.toLocaleTimeString().replace(/^\D*/, "");
      }

      setInterval(function () {
        data1.shift();
        data1.push((Math.random() * (10000 - 0 + 1) + 0).toFixed(0));
        data2.shift();
        data2.push((Math.random() * (10000 - 0 + 1) + 0).toFixed(0));
        data3.shift();
        data3.push((Math.random() * (10000 - 0 + 1) + 0).toFixed(0));
        data4.shift();
        data4.push((Math.random() * (10000 - 0 + 1) + 0).toFixed(0));
        myChart.setOption(option);
      }, 1000);

      window.addEventListener('message', function (event) {
        if (event.data.type === 'changeColor') {
          currentColors = event.data.colors;
          option = getChartOptions(currentColors);
          myChart.setOption(option);
        }
      });
    </script>
  </body>
</html>
