<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>未來一周氣溫變化</title>
  <script src="/include/jquery@3.3.1/jquery.min.js"></script>
  <script src="/include/require@2.3.6/require.js"></script>
</head>

<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: transparent;
  }

  #ex04 {
    width: 100%;
    height: 100%;
  }
</style>

<body>
  <div id="ex04"></div>
  <script type="text/javascript">
    require.config({
      paths: {
        echarts: "/include/echarts/echarts.min",
      },
    });
    require(["echarts"], function (echarts) {

      function setSize(chartDom, baseSize) {
        const chartWidth = chartDom.clientWidth;
        let scaleFactor = chartWidth / 1920;
        return baseSize * scaleFactor;
      }

      function getChartOptions(chartDom, data0, data1, colors) {
        return {
          grid: {
            x: setSize(chartDom, 40),
            x2: setSize(chartDom, 10),
            y: setSize(chartDom, 30),
            y2: setSize(chartDom, 20),
            borderWidth: 1,
          },
          tooltip: {
            trigger: "axis",
            backgroundColor: '#333333', // 背景
            borderColor: '#ffffff', // 框
            textStyle: {
              color: '#ffffff' // 文字
            }
          },
          legend: {
          },
          xAxis: {
            type: "category",
            boundaryGap: false,
            data: data0,
            axisLine: {
              lineStyle: {
                color:'rgba(255, 255, 255, 0.5)' // x軸線條
              }
            },
            axisLabel: {
              color: colors.axisLineColor || '#000000' // x軸標籤
            }
          },
          yAxis: {
            type: "value",
            axisLabel: {
              formatter: "{value} °C",
              color: colors.axisLineColor || '#000000' // Y軸標籤
            },
            axisLine: {
              lineStyle: {
                color:'rgba(255, 255, 255, 0.5)' // Y軸線條

              }
            },
            splitLine: {
              lineStyle: {
                color: '#cccccc' // 網格線
              }
            }
          },
          series: [
            {
              name: "Highest",
              type: "line",
              data: data1,
              itemStyle: {
                color: colors.axisLabelColor || '#ff0000' // 數據點
              },
              lineStyle: {
                color: colors.axisLabelColor || '#00ff00' // 線條顏色
              },
              markPoint: {
                data: [
                  { type: "max", name: "Max", itemStyle: { color: colors.seriesColors ? colors.seriesColors[4] : '#ff0000' } }, // 最大值标记颜色
                  { type: "min", name: "Min", itemStyle: { color: colors.seriesColors ? colors.seriesColors[2] : '#00ff00' } } // 最小值标记颜色
                ]
              },
              markLine: {
                data: [{ type: "average", name: "Avg", lineStyle: { color: colors.axisLabelColor || '#0000ff' } }] // 平均值标记线颜色
              }
            }
          ],
        };
      }

      var chartDom = document.getElementById("ex04");
      var myChart = echarts.init(chartDom);

      var initialData0 = ["", "", "", "", "", "", ""];
      var initialData1 = ["", "", "", "", "", "", ""];
      var currentData0 = [...initialData0];
      var currentData1 = [...initialData1];
      var currentColors = {
        axisLineColor: '#9e9e9e',
        axisLabelColor: '#757575',
        seriesColors: ['#FFCC70', '#FFFADD', '#8ECDDD', '#A2C579', '#22668D'],
      };

      var option = getChartOptions(chartDom, currentData0, currentData1, currentColors);
      myChart.setOption(option);

      function resizeChart() {
        myChart.setOption(option);
        myChart.resize();
      }

      window.addEventListener('resize', resizeChart);

      // 🚀control data
      var data0 = option.xAxis.data;
      var data1 = option.series[0].data;

      function getTime() {
        var now = new Date();
        return now.toLocaleTimeString().replace(/^\D*/, "");
      }

      setInterval(function () {
        data0.shift();
        data0.push(getTime());
        data1.shift();
        data1.push((Math.random() * (80 - 60 + 1) + 60).toFixed(2));
        // 只更新數據
        myChart.setOption({
          xAxis: {
            data: currentData0
          },
          series: [
            {
              data: currentData1
            }
          ]
        });
      }, 1000);

      window.addEventListener('message', function (event) {
        if (event.data.type === 'changeColor') {
          currentColors.lineColor = event.data.colors.barColor;
          currentColors.axisLabelColor = event.data.colors.axisLabelColor;
          currentColors.axisLineColor = event.data.colors.axisLineColor;
          currentColors.seriesColors = event.data.colors.seriesColors;
          var option = getChartOptions(chartDom, currentData0, currentData1, currentColors);
          myChart.setOption(option);
        }
      });

    });


  </script>
</body>

</html>
