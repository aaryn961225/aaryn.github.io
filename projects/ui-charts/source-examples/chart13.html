<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>堆疊條形圖</title>
  <script src="/include/jquery@3.3.1/jquery.min.js"></script>
  <script src="/include/require@2.3.6/require.js"></script>
</head>

<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  #ex13 {
    width: 100%;
    height: 100%;
  }
</style>

<body>
  <div id="ex13"></div>
  <script type="text/javascript">
    require.config({
      paths: {
        echarts: "/include/echarts/echarts.min",
      },
    });
    require(["echarts"], function (echarts) {

      function setSize(chartDom, baseSize) {
        const chartWidth = chartDom.clientWidth;
        let scaleFactor = chartWidth / 1920;
        return baseSize * scaleFactor;
      }

      function getChartOptions(chartDom, data0, data1, data2, data3, data4, data5, data6, data7, data8, colors) {
        return {
          grid: {
            x: setSize(chartDom, 40),
            x2: setSize(chartDom, 10),
            y: setSize(chartDom, 30),
            y2: setSize(chartDom, 20),
            borderWidth: 1,
            containLabel: true,
          },
          tooltip: {
            trigger: "axis",
            axisPointer: {
              type: "shadow",
            },
          },
          xAxis: {
            type: "category",
            data: ["", "", "", "", "", "", ""],
            axisLine: {
              lineStyle: {
                color: 'rgba(255, 255, 255, 0.5)' // X軸線條
              }
            },
            axisLabel: {
              color: colors.axisLabelColor || '#000000'// X軸標籤
            }
          },
          yAxis: {
            type: "value",
            axisLabel: {
              color: colors.axisLineColor || '#000000' // Y軸標籤
            },
            axisLine: {
              lineStyle: {
                color: 'rgba(255, 255, 255, 0.5)' // Y軸線條
              }
            },
          },
          series: [
            {
              name: "",
              type: "bar",
              stack: "Ad",
              emphasis: {
                focus: "series",
              },
              data: data0,
              itemStyle: {
                color: colors.seriesColors[0] || "#5470C6",
              },
            },
            {
              name: "",
              type: "bar",
              stack: "Ad",
              emphasis: {
                focus: "series",
              },
              data: data1,
              itemStyle: {
                color: colors.seriesColors[1] || "#5470C6",
              },
            },
            {
              name: "",
              type: "bar",
              stack: "Ad",
              emphasis: {
                focus: "series",
              },
              data: data2,
              itemStyle: {
                color: colors.seriesColors[2] || "#5470C6",
              },
            },
            {
              name: "",
              type: "bar",
              stack: "Ad",
              emphasis: {
                focus: "series",
              },
              data: data3,
              itemStyle: {
                color: colors.seriesColors[3] || "#5470C6",
              },
            },
            {
              name: "",
              type: "bar",
              data: data4,
              emphasis: {
                focus: "series",
              },
              itemStyle: {
                color: colors.seriesColors[4] || "#5470C6",
              },
              markLine: {
                lineStyle: {
                  type: "dashed",
                },
                data: [[{ type: "min" }, { type: "max" }]],
              },
            },
            {
              name: "a",
              type: "bar",
              barWidth: 5,
              stack: "Search Engine",
              emphasis: {
                focus: "series",
              },
              data: data5,
              itemStyle: {
                color: colors.seriesColors[0] || "#5470C6",
              },
            },
            {
              name: "b",
              type: "bar",
              stack: "Search Engine",
              emphasis: {
                focus: "series",
              },
              data: data6,
              itemStyle: {
                color: colors.seriesColors[1] || "#5470C6",
              },
            },
            {
              name: "c",
              type: "bar",
              stack: "Search Engine",
              emphasis: {
                focus: "series",
              },
              data: data7,
              itemStyle: {
                color: colors.seriesColors[2] || "#5470C6",
              },
            },
            {
              name: "d",
              type: "bar",
              stack: "Search Engine",
              emphasis: {
                focus: "series",
              },
              data: data8,
              itemStyle: {
                color: colors.seriesColors[3] || "#5470C6",
              },
            },
          ],
        };
      }

      var chartDom = document.getElementById("ex13");
      var myChart = echarts.init(chartDom);


      var initialData0 = ["", "", "", "", "", ""];
      var initialData1 = ["", "", "", "", "", ""];
      var initialData2 = ["", "", "", "", "", ""];
      var initialData3 = ["", "", "", "", "", ""];
      var initialData4 = ["", "", "", "", "", ""];
      var initialData5 = ["", "", "", "", "", ""];
      var initialData6 = ["", "", "", "", "", ""];
      var initialData7 = ["", "", "", "", "", ""];
      var initialData8 = ["", "", "", "", "", ""];
      var currentData0 = [...initialData0];
      var currentData1 = [...initialData1];
      var currentData2 = [...initialData2];
      var currentData3 = [...initialData3];
      var currentData4 = [...initialData4];
      var currentData5 = [...initialData5];
      var currentData6 = [...initialData6];
      var currentData7 = [...initialData7];
      var currentData8 = [...initialData8];

      var currentColors = {
        seriesColors: ['#FFCC70', '#FFFADD', '#8ECDDD', '#A2C579', '#22668D'],
      };

      var option = getChartOptions(chartDom, currentData0, currentData1, currentData2, currentData3, currentData4, currentData5, currentData6, currentData7, currentData8, currentColors);
      myChart.setOption(option);

      function resizeChart() {
        myChart.setOption(option);
        myChart.resize();
      }

      window.addEventListener('resize', resizeChart);

      // 🚀control data
      var data0 = option.series[0].data;
      var data1 = option.series[1].data;
      var data2 = option.series[2].data;
      var data3 = option.series[3].data;
      var data4 = option.series[4].data;
      var data5 = option.series[5].data;
      var data6 = option.series[6].data;
      var data7 = option.series[7].data;
      var data8 = option.series[8].data;

      function getTime() {
        var now = new Date();
        return now.toLocaleTimeString().replace(/^\D*/, "");
      }

      setInterval(function () {
        data0.shift();
        data0.push((Math.random() * (1800 - 0 + 1) + 0).toFixed(0));
        data1.shift();
        data1.push((Math.random() * (1800 - 0 + 1) + 0).toFixed(0));
        data2.shift();
        data2.push((Math.random() * (1800 - 0 + 1) + 0).toFixed(0));
        data3.shift();
        data3.push((Math.random() * (1800 - 0 + 1) + 0).toFixed(0));
        data4.shift();
        data4.push((Math.random() * (1800 - 0 + 1) + 0).toFixed(0));
        data5.shift();
        data5.push((Math.random() * (1800 - 0 + 1) + 0).toFixed(0));
        data6.shift();
        data6.push((Math.random() * (1800 - 0 + 1) + 0).toFixed(0));
        data7.shift();
        data7.push((Math.random() * (1800 - 0 + 1) + 0).toFixed(0));
        data8.shift();
        data8.push((Math.random() * (1800 - 0 + 1) + 0).toFixed(0));

        myChart.setOption({         
          series: [
            {
              data: currentData0
            },
            {
              data: currentData1
            },
            {
              data: currentData2
            },
            {
              data: currentData3
            },
            {
              data: currentData4
            },
            {
              data: currentData5
            },
            {
              data: currentData6
            },
            {
              data: currentData7
            },
            {
              data: currentData8
            },
          ]
        });
      }, 1000);

      window.addEventListener('message', function (event) {
        if (event.data.type === 'changeColor') {
          currentColors.lineColor = event.data.colors.barColor;
          currentColors.axisLabelColor = event.data.colors.axisLabelColor;
          currentColors.axisLineColor = event.data.colors.axisLineColor;
          currentColors.seriesColors = event.data.colors.seriesColors;
          var option = getChartOptions(chartDom, currentData0, currentData1, currentData2, currentData3, currentData4, currentData5, currentData6, currentData7, currentData8, currentColors);
          myChart.setOption(option);
        }
      });


    });
  </script>
</body>

</html>
