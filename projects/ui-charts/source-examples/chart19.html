<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>極坐標系下的堆疊柱狀圖</title>
  <script src="/include/jquery@3.3.1/jquery.min.js"></script>
  <script src="/include/require@2.3.6/require.js"></script>
</head>

<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  #ex19 {
    width: 100%;
    height: 100%;
  }
</style>

<body>
  <div id="ex19"></div>
  <script type="text/javascript">
    require.config({
      paths: {
        echarts: "/include/echarts/echarts.min",
      },
    });
    require(["echarts"], function (echarts) {

      function setSize(chartDom, baseSize) {
        const chartWidth = chartDom.clientWidth;
        let scaleFactor = chartWidth / 1920;
        return baseSize * scaleFactor;
      }

      function getChartOptions(chartDom, data0, data1, data2, data3, colors) {
        return {
          grid: {
            x: setSize(chartDom, 40),
            x2: setSize(chartDom, 10),
            y: setSize(chartDom, 30),
            y2: setSize(chartDom, 20),
            borderWidth: 1,
          },
          angleAxis: {
            type: "category",
            data: data0,
          },
          radiusAxis: {},
          polar: {},
          series: [
            {
              type: "bar",
              data: data1,
              coordinateSystem: "polar",
              name: "A",
              stack: "a",
              emphasis: {
                focus: "series",
              },
              itemStyle: {
                color: colors.seriesColors[0] || "#5470C6",
              },
            },
            {
              type: "bar",
              data: data2,
              coordinateSystem: "polar",
              name: "B",
              stack: "a",
              emphasis: {
                focus: "series",
              },
              itemStyle: {
                color: colors.seriesColors[1] || "#5470C6",
              },
            },
            {
              type: "bar",
              data: data3,
              coordinateSystem: "polar",
              name: "C",
              stack: "a",
              emphasis: {
                focus: "series",
              },
              itemStyle: {
                color: colors.seriesColors[2] || "#5470C6",
              },
            },
          ],
          legend: {
            show: true,
            data: ["", "", ""],
          },
        }
      };

      var chartDom = document.getElementById("ex19");
      var myChart = echarts.init(chartDom);

      var initialData0 = ["", "", "", "", "", "", ""];
      var initialData1 = ["", "", "", "", "", "", ""];
      var initialData2 = ["", "", "", "", "", "", ""];
      var initialData3 = ["", "", "", "", "", "", ""];
      var currentData0 = [...initialData0];
      var currentData1 = [...initialData1];
      var currentData2 = [...initialData2];
      var currentData3 = [...initialData2];

      var currentColors = {
        seriesColors: ['#FFCC70', '#FFFADD', '#8ECDDD', '#A2C579', '#22668D'],
      };

      var option = getChartOptions(chartDom, currentData0, currentData1, currentData2, currentData3, currentColors);
      myChart.setOption(option);

      function resizeChart() {
        myChart.setOption(option);
        myChart.resize();
      }


      window.addEventListener('resize', resizeChart);

      // 🚀control data
      var data0 = option.angleAxis.data;
      var data1 = option.series[0].data;
      var data2 = option.series[1].data;
      var data3 = option.series[2].data;


      function getTime() {
        var now = new Date();
        return now.toLocaleTimeString().replace(/^\D*/, "");
      }

      setInterval(function () {
        data0.shift();
        data0.push(getTime());
        data1.shift();
        data1.push((Math.random() * 6) + 1);
        data2.shift();
        data2.push((Math.random() * 6) + 1);
        data3.shift();
        data3.push((Math.random() * 6) + 1);

        myChart.setOption({
          angleAxis: {
            data: currentData0
          },
          series: [
            {
              data: currentData1
            },
            {
              data: currentData2
            },
            {
              data: currentData3
            }
          ]
        });
      }, 1000);

      window.addEventListener('message', function (event) {
        if (event.data.type === 'changeColor') {
          currentColors.lineColor = event.data.colors.barColor;
          currentColors.axisLabelColor = event.data.colors.axisLabelColor;
          currentColors.axisLineColor = event.data.colors.axisLineColor;
          currentColors.seriesColors = event.data.colors.seriesColors;
          var option = getChartOptions(chartDom, currentData0, currentData1, currentData2, currentData3, currentColors);
          myChart.setOption(option);
        }
      });
    });
  </script>
</body>

</html>
